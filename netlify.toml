# Configuração de build no Netlify (não usar `next export`, removido do Next.js).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 exige Node.js 20.9 ou superior.
  NODE_VERSION = "22"

# Adaptador oficial do Next.js para o Netlify (rotas, next/image, cache e metadados).
# Declarado explicitamente: sem ele, o deploy publicava a pasta .next como arquivos soltos.
[[plugins]]
  package = "@netlify/plugin-nextjs"
